<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador Secreto</title>
    <style>
        :root {
            --primary: #4f46e5;
            --accent: #10b981;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--card);
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        #display-area {
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            margin: 1rem 0;
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Efeito de brilho pulsante no resultado */
        .result {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
            }

            to {
                text-shadow: 0 0 25px rgba(16, 185, 129, 0.8), 0 0 10px rgba(16, 185, 129, 0.6);
            }
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        button:active {
            transform: translateY(0);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>O QUE VAMOS FAZER HOJE?</h1>

        <div id="display-area">
            <div id="loader" class="loader"></div>
            <div id="result" class="result"></div>
            <div id="placeholder" style="font-style: italic; opacity: 0.5;">Sorteie uma opção de rolê pra hoje...</div>
        </div>

        <button id="draw-btn" onclick="sortear()">SORTEAR</button>
    </div>

    <script>
        // --- EDITE SUA LISTA AQUI ---
        const listaSecreta = [
            "Ferreira Costa",
            "Cinema - RM",
            "Cinema - casa",
            "Jogar PC",
            "Jogar juntos",
            "MC Donalds",
            "Almoço/Jantar fora",
            "Praça Aurora",
            "Cozinhar uma receita nova",
            "Atacadão pr.",
            "Pedir comida *diferente*",
            "Ir num restaurante novo",
            "Jaqueira",
            "Começar um negócio juntos",
            "Planejamento financeiro",
            "Orçar os itens da casa",
            "Fachinar a casa juntos",
        ];
        // ----------------------------

        let ultimosSorteados = []; // Fila para evitar repetição próxima

        function sortear() {
            const btn = document.getElementById('draw-btn');
            const loader = document.getElementById('loader');
            const result = document.getElementById('result');
            const placeholder = document.getElementById('placeholder');

            // Validação de segurança para listas pequenas
            if (listaSecreta.length <= 2) {
                alert("A lista precisa de pelo menos 3 itens para evitar repetições imediatas!");
                return;
            }

            // Reset visual
            btn.disabled = true;
            btn.innerText = "SORTEANDO...";
            placeholder.style.display = 'none';
            result.style.display = 'none';
            loader.style.display = 'block';

            setTimeout(() => {
                let disponiveis = listaSecreta.filter(item => !ultimosSorteados.includes(item));

                // Sorteio puramente aleatório sobre os disponíveis
                const index = Math.floor(Math.random() * disponiveis.length);
                const escolhido = disponiveis[index];

                // Gerencia a fila de "memória"
                ultimosSorteados.push(escolhido);
                if (ultimosSorteados.length > 2) {
                    ultimosSorteados.shift(); // Remove o mais antigo (libera para sorteio novamente)
                }

                // Exibição
                loader.style.display = 'none';
                result.innerText = escolhido;
                result.style.display = 'block';

                btn.disabled = false;
                btn.innerText = "SORTEAR NOVAMENTE";
            }, 1500);
        }
    </script>

</body>

</html>
